syntax = "proto3";

package inventory;

// Quản lý kho (WMS) – chạy chung tiến trình gRPC với Product Service (:50052).
// Mọi RPC thay đổi tồn đều idempotent theo order_id. Xem docs/06-wms-implementation-plan.md
service InventoryService {
  rpc GetSkusForOrder (GetSkusForOrderRequest) returns (GetSkusForOrderResponse);
  rpc HoldStock (HoldStockRequest) returns (StockOperationResponse);
  rpc CommitStock (CommitStockRequest) returns (StockOperationResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (StockOperationResponse);
  rpc ShipStock (ShipStockRequest) returns (StockOperationResponse);
  rpc ReceiveReturn (ReceiveReturnRequest) returns (StockOperationResponse);
  rpc CreateReceipt (CreateReceiptRequest) returns (ReceiptDto);
  rpc AdjustStock (AdjustStockRequest) returns (AdjustStockResponse);
  rpc GetInventoryStocks (GetInventoryStocksRequest) returns (GetInventoryStocksResponse);
  rpc GetInventoryTransactions (GetInventoryTransactionsRequest) returns (GetInventoryTransactionsResponse);
  rpc GetReceipts (GetReceiptsRequest) returns (GetReceiptsResponse);
  rpc ReconcileStock (ReconcileStockRequest) returns (ReconcileStockResponse);
}

message StockItem {
  string sku_id = 1;
  int32 quantity = 2;
}

message GetSkusForOrderRequest {
  repeated string sku_ids = 1;
}

message OrderSkuDto {
  string id = 1;
  string sku_code = 2;
  string sku_name = 3;
  string product_id = 4;
  string product_name = 5;
  string product_status = 6;
  double price = 7;
  bool is_active = 8;
  string thumbnail_url = 9;
}

message GetSkusForOrderResponse {
  repeated OrderSkuDto skus = 1;
}

// Giữ hàng chờ thanh toán (đơn trực tuyến)
message HoldStockRequest {
  string order_id = 1;
  string order_code = 2;
  repeated StockItem items = 3;
  optional int32 ttl_seconds = 4; // Mặc định 900 (15 phút)
}

// Chốt đơn: chuyển HOLD → COMMITTED. Khi đơn chưa có giữ hàng (COD) hoặc giữ hàng đã hết hạn,
// items được dùng để giữ hàng lại trực tiếp từ tồn còn bán được
message CommitStockRequest {
  string order_id = 1;
  string order_code = 2;
  repeated StockItem items = 3;
}

// Nhả hàng: HOLD / COMMITTED → RELEASED (hết hạn, thanh toán thất bại, hủy trước khi xuất kho)
message ReleaseStockRequest {
  string order_id = 1;
  string reason = 2;
}

// Xuất kho: COMMITTED → SHIPPED, trừ tồn vật lý và ghi sổ OUTBOUND
message ShipStockRequest {
  string order_id = 1;
  string performed_by = 2;
}

// Nhận lại hàng hoàn của đơn đã xuất kho: on_hand tăng, ghi sổ RETURN.
// items rỗng = nhận lại toàn bộ; chỉ định items khi một phần hàng hỏng không nhập lại kho
message ReceiveReturnRequest {
  string order_id = 1;
  string performed_by = 2;
  repeated StockItem items = 3;
  string note = 4;
}

message ReceiptItemInput {
  string sku_id = 1;
  int32 quantity = 2;
  double cost_price = 3;
}

// Phiếu nhập kho từ nhà cung cấp: on_hand tăng, ghi sổ INBOUND
message CreateReceiptRequest {
  optional string warehouse_id = 1; // Mặc định: kho mặc định
  string supplier_name = 2;
  string note = 3;
  string created_by = 4;
  repeated ReceiptItemInput items = 5;
}

message ReceiptItemDto {
  string sku_id = 1;
  string sku_code = 2;
  string sku_name = 3;
  string product_name = 4;
  int32 quantity = 5;
  double cost_price = 6;
}

message ReceiptDto {
  string id = 1;
  string code = 2;
  string warehouse_id = 3;
  string warehouse_code = 4;
  string supplier_name = 5;
  string note = 6;
  string created_by = 7;
  string created_at = 8;
  repeated ReceiptItemDto items = 9;
  int32 total_quantity = 10;
  double total_cost = 11;
}

// Điều chỉnh kiểm kê: on_hand ± quantity_delta, ghi sổ ADJUSTMENT
message AdjustStockRequest {
  string sku_id = 1;
  optional string warehouse_id = 2; // Mặc định: kho mặc định
  int32 quantity_delta = 3; // Khác 0: dương = thừa, âm = thiếu / hỏng
  string reason = 4;
  string created_by = 5;
}

message InventoryStockDto {
  string sku_id = 1;
  string warehouse_id = 2;
  int32 on_hand = 3;
  int32 reserved = 4;
}

message AdjustStockResponse {
  InventoryStockDto stock = 1;
  string adjustment_code = 2;
}

message ReservationDto {
  string sku_id = 1;
  int32 quantity = 2;
  string status = 3;
  optional string expires_at = 4;
}

message StockOperationResponse {
  bool success = 1;
  string message = 2;
  repeated ReservationDto reservations = 3;
  bool already_processed = 4; // true nếu thao tác đã được thực hiện trước đó (gọi lại)
}

// ---------- Truy vấn (có phân trang: items / total / page / limit) ----------

message GetInventoryStocksRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional string search = 3; // Tên sản phẩm / tên biến thể / mã SKU
  optional string warehouse_id = 4;
  optional bool low_stock_only = 5; // Chỉ SKU có số còn bán được ≤ low_stock_threshold
  optional int32 low_stock_threshold = 6; // Mặc định 5
}

message InventoryStockItemDto {
  string sku_id = 1;
  string sku_code = 2;
  string sku_name = 3;
  string product_id = 4;
  string product_name = 5;
  string warehouse_id = 6;
  string warehouse_code = 7;
  int32 on_hand = 8;   // Tồn thực tế
  int32 reserved = 9;  // Đã chốt, chưa xuất kho
  int32 held = 10;     // Đang giữ chờ thanh toán
  int32 available = 11; // Còn bán được = on_hand − reserved − held
}

message GetInventoryStocksResponse {
  repeated InventoryStockItemDto items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetInventoryTransactionsRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional string sku_id = 3;
  optional string type = 4; // INBOUND | OUTBOUND | RETURN | ADJUSTMENT
  optional string ref_id = 5; // Mã phiếu nhập / mã đơn / mã điều chỉnh
  optional string from = 6; // ISO 8601
  optional string to = 7;   // ISO 8601
}

message InventoryTransactionDto {
  string id = 1;
  string sku_id = 2;
  string sku_code = 3;
  string sku_name = 4;
  string product_name = 5;
  string warehouse_code = 6;
  string type = 7;
  int32 quantity = 8;
  int32 balance_after = 9;
  string ref_type = 10;
  string ref_id = 11;
  string note = 12;
  string created_by = 13;
  string created_at = 14;
}

message GetInventoryTransactionsResponse {
  repeated InventoryTransactionDto items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetReceiptsRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional string search = 3; // Mã phiếu / nhà cung cấp
}

message GetReceiptsResponse {
  repeated ReceiptDto items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// Dựng lại Redis stock:{skuId} từ database (on_hand − reserved − HOLD chưa nhả).
// Nên chạy khi ít giao dịch: giá trị ghi đè có thể lệch nếu đúng lúc đó có lượt giữ hàng đang xử lý
message ReconcileStockRequest {
  repeated string sku_ids = 1; // Rỗng = toàn bộ SKU có tồn
}

message StockDriftDto {
  string sku_id = 1;
  optional int32 redis_before = 2; // Không có = key chưa tồn tại
  int32 expected = 3;
}

message ReconcileStockResponse {
  int32 checked = 1;
  repeated StockDriftDto drifts = 2; // Các SKU bị lệch đã được sửa
}
